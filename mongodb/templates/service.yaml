apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: db
spec:
  ports:
    - protocol: TCP
      port: 27017
      targetPort: 27017
  selector:
    project: roboshop
    component: mongodb
    tier: db